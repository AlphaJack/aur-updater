name: update_packages

# requirements:
# - secret AUR_SSH_PRIVATE_KEY, of an AUR account maintaining the packages in nvchecker.toml

on:
  schedule:
    # every day at 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and commit, but do not push to the AUR
        type: boolean
        default: true
      max_updates:
        description: Max packages to update, overrides the MAX_UPDATES variable (empty means no limit)
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:

  check:
    name: Check upstream versions
    runs-on: ubuntu-latest
    container: archlinux:base-devel # zizmor: ignore[unpinned-images] rolling release, rebuilt upstream regularly
    permissions:
      contents: read
    outputs:
      outdated: ${{ steps.check.outputs.outdated }}
    steps:

      # python-packaging is needed by the pypi source
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed jq nvchecker python-packaging

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare AUR and upstream versions
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # input for one-off runs, otherwise repository variable, empty means no limit
          MAX_UPDATES: ${{ inputs.max_updates || vars.MAX_UPDATES }}
        run: |
          outdated="$(./check_packages.py)"
          echo "${outdated}" | jq .
          echo "outdated=${outdated}" >> "$GITHUB_OUTPUT"

  update:
    name: ${{ matrix.name }} ${{ matrix.oldver }} -> ${{ matrix.newver }}
    needs: check
    if: needs.check.outputs.outdated != '[]'
    runs-on: ubuntu-latest
    container: archlinux:base-devel # zizmor: ignore[unpinned-images] rolling release, rebuilt upstream regularly
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.check.outputs.outdated) }}
    env:
      PKG: ${{ matrix.name }}
      NEWVER: ${{ matrix.newver }}
    steps:

      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git jq openssh pacman-contrib sudo

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # makepkg refuses to run as root
      - name: Create build user
        env:
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"
          sudo -u builder git config --global user.name "${OWNER}"
          sudo -u builder git config --global user.email "${OWNER_ID}+${OWNER}@users.noreply.github.com"

      - name: Bump version, update checksums and .SRCINFO
        run: sudo -u builder ./update_packages.sh prepare "$PKG" "$NEWVER"

      - name: Install package dependencies
        if: matrix.build
        run: sudo -u builder ./update_packages.sh deps "$PKG"

      - name: Verify sources
        if: ${{ !matrix.build }}
        run: sudo -u builder ./update_packages.sh verify "$PKG"

      - name: Build package
        if: matrix.build
        run: sudo -u builder ./update_packages.sh build "$PKG"

      - name: Commit
        run: sudo -u builder ./update_packages.sh commit "$PKG" "$NEWVER"

      # the SSH key only exists after upstream code has finished running
      - name: Push to AUR
        if: github.event_name == 'schedule' || !inputs.dry_run
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Ed25519 SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4, as published on https://aur.archlinux.org
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > ~/.ssh/known_hosts
          git config --global --add safe.directory '*'
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519" \
            git -C "build/$PKG" push "ssh://aur@aur.archlinux.org/$PKG.git" HEAD:master
