name: update_packages

# requirements:
# - secret AUR_SSH_PRIVATE_KEY, of an AUR account maintaining the packages in nvchecker.toml

on:
  schedule:
    # every day at 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run, do not push to the AUR (default uses the DRY_RUN repository variable, or false)
        type: choice
        options:
          - default
          - "true"
          - "false"
        default: default
      packages:
        description: Only update these packages, separated by spaces or commas (empty means all outdated)
        type: string
        default: ""
      rebuild:
        description: Also build the listed packages that are up to date, e.g. after a PKGBUILD fix
        type: boolean
        default: false
      max_updates:
        description: Max packages to update (empty uses the MAX_UPDATES repository variable, defaulting to limit)
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

env:
  # input for one-off runs, otherwise repository variable, unset means push
  DRY_RUN: ${{ inputs.dry_run == 'true' || (inputs.dry_run != 'false' && vars.DRY_RUN == 'true') }}

jobs:

  check:
    name: Check upstream versions
    runs-on: ubuntu-latest
    container: archlinux:base-devel # zizmor: ignore[unpinned-images] rolling release, rebuilt upstream regularly
    permissions:
      contents: read
    outputs:
      outdated: ${{ steps.check.outputs.outdated }}
    steps:

      # python-packaging is needed by the pypi source
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed jq nvchecker openssh python-packaging

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # fail before any package is updated if the push would fail
      - name: Check AUR SSH login
        if: env.DRY_RUN == 'false'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: ./aur_ssh.sh test

      - name: Compare AUR and upstream versions
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # input for one-off runs, otherwise repository variable, empty means no limit
          MAX_UPDATES: ${{ inputs.max_updates || vars.MAX_UPDATES }}
          PACKAGES: ${{ inputs.packages }}
          REBUILD: ${{ inputs.rebuild && '1' || '' }}
        run: |
          outdated="$(./check_packages.py)"
          echo "${outdated}" | jq .
          echo "outdated=${outdated}" >> "$GITHUB_OUTPUT"

  update:
    name: ${{ matrix.delta == 'python' && format('{0} {1} (rebuild for Python {2})', matrix.name, matrix.newver, matrix.python) || matrix.delta == 'rebuild' && format('{0} {1} (rebuild)', matrix.name, matrix.newver) || format('{0} {1} -> {2}', matrix.name, matrix.oldver, matrix.newver) }}
    needs: check
    if: needs.check.outputs.outdated != '[]'
    runs-on: ubuntu-latest
    container: archlinux:base-devel # zizmor: ignore[unpinned-images] rolling release, rebuilt upstream regularly
    # a stuck build would otherwise run for 6 hours
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # GitHub Free runs at most 20 jobs at once, the rest are queued
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.check.outputs.outdated) }}
    env:
      PKG: ${{ matrix.name }}
      NEWVER: ${{ matrix.newver }}
      # set for rebuilds after a Python minor version update
      PYTHON: ${{ matrix.python }}
    steps:

      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git jq openssh pacman-contrib sudo

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # one cache per package, restored and saved outside the build: upstream code
      # can only affect future builds of its own package, never other packages
      - name: Restore build cache
        if: matrix.build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cargo
          key: build-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: build-${{ matrix.name }}-

      # makepkg refuses to run as root
      - name: Create build user
        env:
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          useradd -m builder
          mkdir -p .cargo
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"
          sudo -u builder git config --global user.name "${OWNER}"
          sudo -u builder git config --global user.email "${OWNER_ID}+${OWNER}@users.noreply.github.com"

      - name: Bump version, update checksums and .SRCINFO
        run: sudo -u builder --preserve-env=PYTHON ./update_packages.sh prepare "$PKG" "$NEWVER"

      - name: Install package dependencies
        if: matrix.build
        run: sudo -u builder CARGO_HOME="$GITHUB_WORKSPACE/.cargo" ./update_packages.sh deps "$PKG"

      - name: Verify sources
        if: ${{ !matrix.build }}
        run: sudo -u builder ./update_packages.sh verify "$PKG"

      - name: Build package
        if: matrix.build
        run: sudo -u builder CARGO_HOME="$GITHUB_WORKSPACE/.cargo" ./update_packages.sh build "$PKG"

      # hashFiles() failed to hash the workspace after some builds, check the directory directly
      - name: Check build cache
        id: cache
        if: always() && matrix.build
        run: if [ -n "$(ls -A .cargo/registry 2>/dev/null)" ]; then echo "save=true" >> "$GITHUB_OUTPUT"; fi

      # also after failed or cancelled builds, downloaded crates are reused by the next attempt
      - name: Save build cache
        if: always() && steps.cache.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cargo
          key: build-${{ matrix.name }}-${{ github.run_id }}

      - name: Commit
        run: sudo -u builder --preserve-env=PYTHON ./update_packages.sh commit "$PKG" "$NEWVER"

      # the SSH key only exists after upstream code has finished running
      - name: Push to AUR
        if: env.DRY_RUN == 'false'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          git config --global --add safe.directory '*'
          ./aur_ssh.sh push "$PKG"
