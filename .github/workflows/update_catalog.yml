name: update_catalog

# requirements:
# - Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests"

on:
  schedule:
    # every Monday at 05:00 UTC
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:

  sync:
    name: Add adopted and remove disowned packages
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the sync-packages branch
      pull-requests: write # open the pull request
    steps:

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find open sync pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "number=$(gh pr list --head sync-packages --state open --json number --jq '.[0].number')" >> "$GITHUB_OUTPUT"

      # keep review commits of the open pull request, add a commit on top of them
      - name: Check out open pull request
        if: steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sync-packages
          git switch -c sync-packages FETCH_HEAD

      - name: Create branch
        if: ${{ !steps.pr.outputs.number }}
        run: git switch -c sync-packages

      - name: Sync nvchecker.toml with the AUR
        id: sync
        run: |
          ./update_catalog.py | tee summary.txt
          if git diff --quiet -- nvchecker.toml README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tail -n 1 summary.txt > title.txt
          git commit -F title.txt -- nvchecker.toml README.md
          {
            echo "Generated by \`update_catalog.py\`. Review guessed sources and resolve \`# TODO\` entries before merging."
            echo
            echo '```'
            cat summary.txt
            echo '```'
          } > body.md

      - name: Push to open pull request and comment
        if: steps.sync.outputs.changed == 'true' && steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sync-packages
          gh pr comment "${PR}" --body-file body.md

      # a leftover branch from a closed pull request is replaced
      - name: Push and open pull request
        if: steps.sync.outputs.changed == 'true' && !steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sync-packages
          gh pr create --head sync-packages --title "$(cat title.txt)" --body-file body.md
