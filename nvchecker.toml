# metabase also tags enterprise builds as v1.x
[metabase]
source = "github"
github = "metabase/metabase"
use_max_tag = true
exclude_regex = '.*(dev|rc|alpha|beta|pre).*'
include_regex = '^v0\.\d+\.\d+$'
prefix = "v"

