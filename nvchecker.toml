use_max_tag = true
exclude_regex = '.*(dev|rc|alpha|beta|pre).*'
prefix = "v"

# prebuilt binaries of the Rust engine, released since 2.0
[dbt-core-bin]
source = "github"
github = "dbt-labs/dbt-core"
use_max_tag = true
exclude_regex = '.*(dev|rc|alpha|beta|pre).*'
prefix = "v"

[python-gruut-ipa]
source = "pypi"
pypi = "gruut-ipa"

[clickhouse-cpp]
source = "github"
github = "ClickHouse/clickhouse-cpp"
use_latest_release = true
prefix = "v"

[cre2]
source = "github"
github = "marcomaggi/cre2"
use_max_tag = true
exclude_regex = '.*(dev|rc|alpha|beta|pre).*'
prefix = "v"

# wheels from PyPI, while litellm builds from the GitHub tag
[litellm-bin]
source = "pypi"
pypi = "litellm"

# wheels are per Python version, update _py in the PKGBUILD when Arch moves past 3.14
[python-fastuuid-bin]
source = "pypi"
pypi = "fastuuid"
