# One section per AUR package, named exactly like the package.
# Docs: https://nvchecker.readthedocs.io/en/latest/usage.html
# Test a single entry: nvchecker -c nvchecker.toml -e <pkgname>

[__config__]
oldver = "old_ver.json"
newver = "new_ver.json"

# GitHub releases

[gitmal-bin]
source = "github"
github = "antonmedv/gitmal"
use_latest_release = true
prefix = "v"

